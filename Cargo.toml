[package]
name = "tauri-plugin-helpwing"
version = "0.1.0"
description = "Helpwing support chat for Tauri apps."
authors = ["Helpwing"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
homepage = "https://helpwing.app/docs/tauri"
repository = "https://github.com/helpwing/helpwing-tauri-sdk"
keywords = ["tauri", "tauri-plugin", "support", "chat", "helpwing"]
links = "tauri-plugin-helpwing"
exclude = ["/dist-js", "/guest-js", "/node_modules", "/test", "/.gitea"]

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
open = "5"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
